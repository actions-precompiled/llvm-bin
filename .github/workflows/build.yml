# Generated by: go run . generate workflow
# Package: llvm — thin matrix; Go binary owns prep + in-container work.
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream release tag to build (e.g. llvmorg-21.1.0)'
        required: true
        type: string
      publish:
        description: 'Create GitHub Release and upload tarballs'
        required: false
        type: boolean
        default: false
      recreate:
        description: 'If publish: delete existing release then create fresh'
        required: false
        type: boolean
        default: false

concurrency:
  group: package-build-${{ github.event.inputs.version || github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      recreate: ${{ steps.plan.outputs.recreate }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - id: plan
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
          INPUT_RECREATE: ${{ github.event.inputs.recreate }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise exec -- go run . plan


  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: windows-amd64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    # No timeout-minutes: GHA hosted runners hard-cap jobs at 6h anyway.
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # MSVC env for windows-* matrix rows (MinGW half-builds lack CRT headers for builtins).
      - uses: ilammy/msvc-dev-cmd@v1
        if: ${{ startsWith(matrix.target, 'windows-') }}
        with:
          arch: ${{ contains(matrix.target, 'arm') && 'arm64' || 'x64' }}
      - name: go run . build
        env:
          APC_TARGETS: ${{ matrix.target }}
          APC_IMAGE_TAG: ci
          APC_PUBLISH: "0"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise exec -- go run . build "${{ needs.plan.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: llvm-${{ needs.plan.outputs.version }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, build]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p target
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | while read -r f; do
            base=$(basename "$f")
            case "$base" in
              *-linux-amd64.*)   d=target/linux-amd64 ;;
              *-linux-aarch64.*) d=target/linux-aarch64 ;;
              *-windows-amd64.*) d=target/windows-amd64 ;;
              *-windows-arm64.*) d=target/windows-arm64 ;;
              *) d=target/misc ;;
            esac
            mkdir -p "$d"
            cp -v "$f" "$d/"
          done
          find target -type f -ls
      - name: go run . publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APC_TARGETS: "linux-amd64 linux-aarch64 windows-amd64"
        run: |
          recreate_flag=
          case "${{ needs.plan.outputs.recreate }}" in true|1|yes) recreate_flag=--recreate ;; esac
          mise exec -- go run . publish $recreate_flag "${{ needs.plan.outputs.version }}"
