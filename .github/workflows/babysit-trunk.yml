name: Babysit trunk

# Nightly trunk build; failures stay visible for babysitting. Does not publish.
on:
  schedule:
    - cron: '17 6 * * *'  # ~06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Build for trunk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run Build --repo "${{ github.repository }}" \
            -f version=trunk \
            -f publish=false \
            -f recreate=false
